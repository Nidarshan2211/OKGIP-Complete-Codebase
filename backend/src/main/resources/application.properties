# Server Configuration (Default to port 8085)
server.port=${PORT:8085}

# Active Profile: 'h2' (Embedded H2 database) or 'supabase' (Remote Supabase PostgreSQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}
spring.config.import=optional:classpath:application-local.properties

# Common JPA & Hibernate Settings
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jackson.serialization.fail-on-empty-beans=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8085,http://localhost:8080,http://localhost:3000,http://localhost:80,https://*.onrender.com}

# Gemini API Key Configuration
gemini.api.key=${GEMINI_API_KEY:}
